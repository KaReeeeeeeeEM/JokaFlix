    <style>
      /* Splash screen styles */
      #splash-screen {
        position: fixed;
        z-index: 9999;
        inset: 0;
        background: #111;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.7s cubic-bezier(.4,0,.2,1);
        opacity: 1;
      }
      #splash-logo {
        width: 220px;
        height: 220px;
        margin-bottom: 10px;
        animation: splash-bounce 1.2s infinite alternate cubic-bezier(.4,0,.2,1);
        object-fit: contain;
        filter: drop-shadow(0 4px 32px #d03801cc);
      }
      #splash-slogan {
        color: #fff;
        font-family: 'Bebas Neue', 'Montserrat', Arial, sans-serif;
        font-size: 2.2rem;
        letter-spacing: 0.08em;
        text-align: center;
        opacity: 0.92;
        animation: splash-fadein 1.2s 0.5s forwards;
        font-weight: 700;
        text-shadow: 0 2px 12px #d03801cc, 0 1px 2px #000a;
        line-height: 1.1;
      }
      @keyframes splash-bounce {
        0% { transform: scale(1) translateY(0);}
        100% { transform: scale(1.08) translateY(-18px);}
      }
      @keyframes splash-fadein {
        from { opacity: 0; transform: translateY(20px);}
        to { opacity: 0.92; transform: translateY(0);}
      }
      #splash-screen.splash-hide {
        opacity: 0;
        pointer-events: none;
      }
    </style>

    <title>JokaFlix | Home of Movies and Series</title>

  <body>
    <!-- Splash screen overlay -->
    <div id="splash-screen">
      <img id="splash-logo" src="/logo-sub.png" alt="JokaFlix Logo" />
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script defer async>
      document.addEventListener('DOMContentLoaded', function() {
        // setting global variables
        window.botId = 4242
        
        // create div with id = sarufi-chatbox
        const div = document.createElement("div")
        div.id = "sarufi-chatbox"
        document.body.appendChild(div)
    
        // create and attach script tag
        const script = document.createElement("script")
        script.crossOrigin = true
        script.type = "module"
        script.src = "https://cdn.jsdelivr.net/gh/flexcodelabs/sarufi-chatbox/example/vanilla-js/script.js"
        document.head.appendChild(script)
    
        // create and attach css
        const style = document.createElement("link")
        style.crossOrigin = true
        style.rel = "stylesheet"
        style.href = "https://cdn.jsdelivr.net/gh/flexcodelabs/sarufi-chatbox/example/vanilla-js/style.css"
        document.head.appendChild(style)

        // Splash screen fade-out logic
        window.addEventListener('load', function() {
          setTimeout(function() {
            const splash = document.getElementById('splash-screen');
            if (splash) {
              splash.classList.add('splash-hide');
              setTimeout(() => splash.remove(), 800);
            }
          }, 900); // Show splash for at least 900ms
        });
      });
    </script>
  </body>
